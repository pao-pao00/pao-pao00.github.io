<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦点轮播</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .banner-wrap {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }
        .banner-img img {
            width: 100%;
            display: block;
        }
        .arrow {
            width: 50px;
            height: 50px;
            background: rgba(180,230,255,0.6);
            border:2px solid #f44336;
            border-radius:6px;
            display:flex;align-items:center;justify-content:center;
            font-size:24px;color:#fff;cursor:pointer;position:absolute;top:50%;transform:translateY(-50%);z-index:9
        }
        .arrow-left{left:15px;}
        .arrow-right{right:15px;}
        .dot-box{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;}
        .dot{width:20px;height:20px;border:2px solid red;border-radius:50%;background:#b8e8f9;cursor:pointer;}
        .dot.active{background:#22aadd;}
    </style>
</head>
<body>
<div class="banner-wrap">
    <div class="arrow arrow-left">&lt;</div>
    <div class="banner-img">
        <!-- 稳定测试图地址，1、2、3三张轮播图 -->
        <img src="c:\Users\14893\OneDrive\Desktop\作业\banner1.jpg" alt="轮播图">
    </div>
    <div class="arrow arrow-right">&gt;</div>
    <div class="dot-box">
        <div class="dot"></div>
        <div class="dot active"></div>
        <div class="dot"></div>
    </div>
</div>
<script>
const dots = document.querySelectorAll('.dot');
let idx=1;
dots.forEach((d,i)=>d.onclick=()=>{
    dots.forEach(x=>x.classList.remove('active'));d.classList.add('active');idx=i;
})
document.querySelector('.arrow-right').onclick=()=>{
    idx=(idx+1)%dots.length;
    dots.forEach(x=>x.classList.remove('active'));dots[idx].classList.add('active');
}
document.querySelector('.arrow-left').onclick=()=>{
    idx=(idx-1+dots.length)%dots.length;
    dots.forEach(x=>x.classList.remove('active'));dots[idx].classList.add('active');
}
</script>
</body>
</html>
